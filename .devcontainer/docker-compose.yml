services:
  app:
    env_file: ../.env
    build:
      context: ..
      dockerfile: Dockerfile
      target: development-dependencies-env
    ports:
      - "5173:5173"
    volumes:
      - ..:/app:cached
      - /app/node_modules
      - repos:/repos
      - /var/run/docker.sock:/var/run/docker.sock
    command: sleep infinity
    environment:
      - DATABASE_URL=postgresql://compiler:compiler@db:5432/compiler
      - REDIS_URL=redis://redis:6379
      - SHELL=/bin/bash
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=compiler
      - POSTGRES_PASSWORD=compiler
      - POSTGRES_DB=compiler
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compiler"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine

volumes:
  pgdata:
  repos:
